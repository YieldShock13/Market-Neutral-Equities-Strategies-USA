name: Original Meridian daily refresh
on:
  workflow_dispatch:
  push:
    paths:
      - original_refresh/manual_trigger.txt
permissions:
  contents: write
concurrency:
  group: meridian-original-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-original-refresh.txt
      - run: pip install -r requirements-original-refresh.txt
      - name: Run original notebook pipeline
        run: |
          set -euo pipefail
          mkdir -p runtime_original
          python original_refresh/run.py 2>&1 | tee runtime_original/run.log
      - name: Record run log
        if: always()
        run: |
          if [ -f runtime_original/run.log ]; then
            tail -n 60 runtime_original/run.log >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish original-model results
        run: |
          git config user.name 'Meridian original refresh'
          git config user.email 'YieldShock13@users.noreply.github.com'
          git add pipeline
          if ! git diff --cached --quiet; then
            git commit -m 'Update original Meridian model to latest completed session'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-model-run-evidence
          path: |
            runtime_original/
            mvou_universe/
          retention-days: 30
