name: Meridian daily refresh
on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - scripts/**
      - .github/workflows/refresh.yml
permissions:
  contents: write
concurrency:
  group: meridian-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-refresh.txt
      - run: pip install -r requirements-refresh.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/refresh.py
      - name: Publish refreshed results
        run: |
          git config user.name 'Meridian refresh'
          git config user.email 'YieldShock13@users.noreply.github.com'
          git add pipeline
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Meridian daily research'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meridian-run-audit
          path: |
            runtime/**/*.csv
            runtime/**/*.json
            runtime/**/*.npz
            runtime/*.pkl
            runtime/failure.txt
          retention-days: 30
