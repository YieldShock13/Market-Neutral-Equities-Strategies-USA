name: Original model restored — automatic refresh disabled
on:
  push:
    paths:
      - .github/workflows/refresh.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meridian-refresh
  cancel-in-progress: true
jobs:
  stop-modified-refresh:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Original model restored. Modified automatic refresh disabled.'
